name: Mobile test builds

# Deliberate test builds only. No store upload, release signing or deployment.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Test build to create
        type: choice
        options: [android, ios, both]
        default: android

permissions:
  contents: read

jobs:
  android:
    if: inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      # The hosted Ubuntu image already includes this SDK. Do not install
      # the obsolete SDK "tools" package via a second setup action.
      - name: Check hosted Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-36"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - run: npm ci
      - run: npm test
      - run: npm run build:android:debug
      - run: python3 scripts/verify-apk.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ADPAI-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: xcodebuild -version
      - run: npm ci
      - run: npm test
      - run: npm run build:mobile && npx cap sync ios
      - name: Build for simulator without release signing
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Preserve app bundle
        run: ditto -c -k --sequesterRsrc --keepParent ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app ADPAI-ios-simulator.zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ADPAI-ios-simulator
          path: ADPAI-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14
