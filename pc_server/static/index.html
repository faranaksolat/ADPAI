<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADPAI · Private PC test</title><link rel="icon" href="/assets/icons/icon-192.png"><link rel="stylesheet" href="/assets/app.css"><link rel="stylesheet" href="/client/pc.css"></head>
<body><main class="app pcApp"><header class="appHeader"><div class="brand"><span class="mark">A</span><strong class="name">ADPAI</strong></div><select id="language" aria-label="Language"><option value="en">English</option><option value="ko">한국어</option></select></header>
<h1 id="title">Your private PC reader</h1><p id="connectionNotice" class="menuWarning"></p>
<section id="pairing" class="card"><h2 id="pairTitle">Connect to your PC</h2><p id="pairHint"></p><label for="key" id="keyLabel">Private pairing code</label><input id="key" type="password" autocomplete="off"><button id="pair" class="btn primary">Connect</button></section>
<section id="scanner" class="card" hidden><p id="paired"></p><div class="pcModes"><button id="shopping" class="btn primary" aria-pressed="true">Shopping</button><button id="menu" class="btn outline" aria-pressed="false">Restaurant menu</button></div>
<h2 id="profileTitle">Ingredients to avoid</h2><div id="allergens" class="chips"></div><label id="customLabel" for="custom">Other ingredients, separated by commas</label><input id="custom" type="text">
<h2 id="photoTitle">Add label photos</h2><p id="photoHint"></p><input id="photos" type="file" accept="image/*" multiple><div id="previews" class="photos"></div><button id="read" class="btn brandbtn">Read on my PC</button><p id="progress" role="status" aria-live="polite"></p><button id="disconnect" class="textButton">Disconnect this browser</button></section>
<section id="results" class="card" hidden><h2 id="resultTitle"></h2><p id="resultWarning"></p><div id="cards" class="productResults"></div><details><summary id="rawTitle">View text read</summary><pre id="raw"></pre></details></section>
<p id="error" role="alert"></p><footer id="footer" class="footer safetyFooter"></footer><p class="footer">ADPAI private PC pilot · <a href="/client/privacy.html">Privacy / 개인정보 처리 안내</a></p></main><script type="module" src="/client/client.js"></script></body></html>
